/**:
  controller_manager:
    ros__parameters:
      update_rate: 100

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      mecanum_controller:
        type: mecanum_drive_controller/MecanumDriveController

      skid_controller:
        type: diff_drive_controller/DiffDriveController

      diff_controller:
        type: diff_drive_controller/DiffDriveController


/**/mecanum_controller:
  ros__parameters:

    front_left_wheel_command_joint_name: wheel4_joint
    front_right_wheel_command_joint_name: wheel3_joint
    rear_right_wheel_command_joint_name: wheel2_joint
    rear_left_wheel_command_joint_name: wheel1_joint

    kinematics:
      wheels_radius: 0.04
      sum_of_robot_center_projection_on_X_Y_axis: 0.18625   # 0.08125 + 0.105

    base_frame_id: base_link
    odom_frame_id: odom

    enable_odom_tf: true
    reference_timeout: 0.5


/**/skid_controller:
  ros__parameters:

    left_wheel_names:
      - wheel1_joint
      - wheel4_joint

    right_wheel_names:
      - wheel2_joint
      - wheel3_joint

    # Vía geométrica 0.208 (b = 0.104). Por el derrape hace falta una vía
    # efectiva mayor (en el real 2·B_SKID = 0.34, χ ≈ 1.64). Valor de partida:
    # calibrar con un giro en simulación ->  nueva = actual · θ_mandado / θ_gt
    wheel_separation: 0.281
    wheel_radius: 0.0325

    base_frame_id: base_link
    odom_frame_id: odom

    enable_odom_tf: true

    cmd_vel_timeout: 0.5

    publish_rate: 50.0

    use_stamped_vel: true


/**/diff_controller:
  ros__parameters:

    left_wheel_names:
      - wheel1_joint

    right_wheel_names:
      - wheel2_joint

    wheel_separation: 0.22    # b = 0.11, igual que el firmware
    wheel_radius: 0.0325

    base_frame_id: base_link
    odom_frame_id: odom

    enable_odom_tf: true

    cmd_vel_timeout: 0.5

    publish_rate: 50.0

    use_stamped_vel: true
