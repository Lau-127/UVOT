/**:
  controller_manager:
    ros__parameters:
      update_rate: 100

      joint_state_broadcaster:
        type: joint_state_broadcaster/JointStateBroadcaster

      mecanum_controller:
        type: mecanum_drive_controller/MecanumDriveController

      skid_controller:
        type: diff_drive_controller/DiffDriveController

      diff_controller:
        type: diff_drive_controller/DiffDriveController


/**/mecanum_controller:
  ros__parameters:

    front_left_wheel_command_joint_name: wheel4_joint
    front_right_wheel_command_joint_name: wheel3_joint
    rear_right_wheel_command_joint_name: wheel2_joint
    rear_left_wheel_command_joint_name: wheel1_joint

    kinematics:
      wheels_radius: 0.04
      sum_of_robot_center_projection_on_X_Y_axis: 0.18

    base_frame_id: base_link
    odom_frame_id: odom

    enable_odom_tf: true
    reference_timeout: 0.5


/**/skid_controller:
  ros__parameters:

    left_wheel_names:
      - wheel1_joint
      - wheel4_joint

    right_wheel_names:
      - wheel2_joint
      - wheel3_joint

    wheel_separation: 0.296
    wheel_radius: 0.0375

    base_frame_id: base_link
    odom_frame_id: odom

    enable_odom_tf: true

    cmd_vel_timeout: 0.5

    publish_rate: 50.0

    use_stamped_vel: true


/**/diff_controller:
  ros__parameters:

    left_wheel_names:
      - wheel1_joint

    right_wheel_names:
      - wheel2_joint

    wheel_separation: 0.232
    wheel_radius: 0.0375

    base_frame_id: base_link
    odom_frame_id: odom

    enable_odom_tf: true

    cmd_vel_timeout: 0.5

    publish_rate: 50.0

    use_stamped_vel: true
